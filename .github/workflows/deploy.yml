name: Deploy site

# Publica dist/site.html no GitHub Pages a cada push na main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publicar (usa data/portfolio.json se existir; senão o template)
        env:
          PUBLISH_NDA_PASSWORD: ${{ secrets.NDA_PASSWORD }}
        run: |
          if [ -f data/portfolio.json ]; then
            PUBLISH_INPUT=data/portfolio.json npm run publish
          else
            npm run publish
          fi
      - name: Preparar saída do Pages (site.html -> index.html)
        run: |
          mkdir -p _site
          cp dist/site.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
